---
- name: cleanup | leapp_cifs_detected | Restore /etc/fstab
  ansible.builtin.copy:
    src: /etc/fstab.leapp_test_backup
    dest: /etc/fstab
    remote_src: true
    mode: preserve

- name: cleanup | leapp_cifs_detected | Remove backup
  ansible.builtin.file:
    path: /etc/fstab.leapp_test_backup
    state: absent
...
